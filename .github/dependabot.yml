# Updates are opened against the default branch, which is main.
# target-branch is left out on purpose: setting it stops this file from
# applying to Dependabot security updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # One entry per Go module. Keep the list in step with
  # .github/workflows/ci.yml and the README.
  - package-ecosystem: "gomod"
    directory: "/casbin"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/cloudwatch"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/cors"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/csrf"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/expmetric"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/jwt"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/newrelic"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/pg"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/prometheus"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/secure"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/throttler"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/tollboothic"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/zap"
    schedule:
      interval: "daily"

  # The two examples that are Go modules of their own.
  - package-ecosystem: "gomod"
    directory: "/csrf/_example"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/zap/_examples/example_2"
    schedule:
      interval: "weekly"
